<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos"> 
                <div class="info">
                    <h3 id="high-score">High Score: 0</h3>
                </div>
                <div class="info">
                    <h3 id="score">Score: 0</h3>
                </div>
                <div class="info">
                    <h3 id="time">Time: 00:00</h3>
                </div>
            </div>
            <div class="board">                
            </div> 
        </section>
        <div class="modal">
            <div class="start-game">
                <h3> Welcome to Snake Game </h3>
                <button class="btn start-btn"> Start Game </button>
            </div>
            <div class="Game-Over">
                    <h3> Game Over </h3>
                    <button class="btn restart-btn"> Restart Game </button>
                    
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    
</body>
</html>
